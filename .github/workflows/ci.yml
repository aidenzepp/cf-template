name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run test
      - run: bun run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:browser

  design-record:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun tools/design-review/record.ts
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # One required context for the three jobs above (#43; DEP-5 replaces this job and keeps the name).
  # Passing results: `success` for every needed job. `skipped` passes only for design-record on a
  # push to main, where its own `if:` skips it; on a pull request it always runs and passes itself
  # when apps/web and packages/ui are untouched, so a pull request needs `success` from all three.
  merge-gate:
    needs: [checks, browser, design-record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "$CHECKS" = success
          test "$BROWSER" = success
          test "$DESIGN_RECORD" = success || { test "$EVENT" = push && test "$DESIGN_RECORD" = skipped; }
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
          DESIGN_RECORD: ${{ needs.design-record.result }}
          EVENT: ${{ github.event_name }}
