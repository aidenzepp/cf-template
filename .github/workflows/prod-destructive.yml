name: Prod destructive

# The owner's confirmation of a destructive `prod` plan that `prod.yml` held (#43 item 7, DC6,
# DC21). Only a run that the owner both started and triggered proceeds: an App or agent dispatch
# reports `confirm` as skipped. Every input reaches a step only through `env:` and is read as a
# quoted shell variable, never as `${{ inputs.* }}` inside a `run:` string (N-1). Never re-run
# `confirm`; dispatch again.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full commit SHA on main that prod.yml held
        required: true
        type: string
      fingerprint:
        description: The plan fingerprint prod.yml printed for that commit
        required: true
        type: string
      reason:
        description: Why the destructive change is confirmed (kept in the run log)
        required: true
        type: string

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"

jobs:
  confirm:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.ENVIRONMENTS == 'true' && 'prod-destructive' || '' }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      INPUT_SHA: ${{ inputs.sha }}
      INPUT_FINGERPRINT: ${{ inputs.fingerprint }}
      INPUT_REASON: ${{ inputs.reason }}
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      STACK_NAME: ${{ vars.STACK_NAME }}
    steps:
      - name: Record the request
        run: |
          {
            echo '### prod-destructive confirmation'
            printf -- '- sha: `%s`\n' "$INPUT_SHA"
            printf -- '- fingerprint: `%s`\n' "$INPUT_FINGERPRINT"
            printf -- '- reason: %s\n' "$INPUT_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          # Workflow commands are paused while the inputs print, so a `::` line inside one is text.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          printf 'sha: %s\nfingerprint: %s\nreason: %s\n' "$INPUT_SHA" "$INPUT_FINGERPRINT" "$INPUT_REASON"
          echo "::$token::"
      # The Action deploys `prod` only when the run's ref is main, so a dispatch from any other ref
      # stops here rather than deploying nothing and reporting success.
      - name: Refuse a ref other than main or a malformed sha
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::Dispatch from main, not $GITHUB_REF."; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::sha must be a full 40-character lowercase commit SHA.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the held commit
        run: |
          git merge-base --is-ancestor "$INPUT_SHA" origin/main || { echo '::error::sha is not a commit on main.'; exit 1; }
          git checkout --detach "$INPUT_SHA"
      - uses: ./.github/actions/setup
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      # An unset secret arrives as an empty string, which the deploy would read as a set value, so
      # only the non-empty provider pairs and the proxy secret reach the later steps.
      - name: Export the provider credentials and origins
        env:
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.OAUTH_PROXY_SECRET }}
        run: |
          providers=""
          for prefix in GITHUB GOOGLE; do
            id_name="OAUTH_${prefix}_CLIENT_ID"
            secret_name="OAUTH_${prefix}_CLIENT_SECRET"
            if [ -n "${!id_name}" ]; then echo "${prefix}_CLIENT_ID=${!id_name}" >> "$GITHUB_ENV"; fi
            if [ -n "${!secret_name}" ]; then echo "${prefix}_CLIENT_SECRET=${!secret_name}" >> "$GITHUB_ENV"; fi
            if [ -n "${!id_name}" ] && [ -n "${!secret_name}" ]; then
              providers="${providers:+$providers,}\"$(echo "$prefix" | tr '[:upper:]' '[:lower:]')\""
            fi
          done
          if [ -n "$OAUTH_PROXY_SECRET" ]; then echo "OAUTH_PROXY_SECRET=$OAUTH_PROXY_SECRET" >> "$GITHUB_ENV"; fi
          if [ -n "$CUSTOM_DOMAIN" ] && [ "$CUSTOM_DOMAIN" != workers-dev ]; then
            prod_origin="https://$CUSTOM_DOMAIN"
          else
            prod_origin="https://$STACK_NAME-web-prod.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          fi
          {
            echo "PROD_ORIGIN=$prod_origin"
            echo "SMOKE_ORIGIN=$prod_origin"
            echo "SMOKE_PROVIDERS=[$providers]"
          } >> "$GITHUB_ENV"
      - run: alchemy provider check-env --provider Cloudflare
        working-directory: infra
      - run: alchemy state list
        working-directory: infra
      # Recompute the plan at the held commit: a different fingerprint exits non-zero printing both
      # digests, and a match writes `fingerprint=<digest>` for the check below.
      - id: plan
        name: Re-plan prod
        working-directory: infra
        run: bun scripts/plan-prod.ts --fingerprint "$INPUT_FINGERPRINT"
      - name: Refuse a changed plan
        env:
          PLAN_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        run: |
          if [ -z "$PLAN_FINGERPRINT" ] || [ "$PLAN_FINGERPRINT" != "$INPUT_FINGERPRINT" ]; then
            echo '::error::The prod plan changed since prod.yml held it: the fingerprint differs. Read the new plan in prod.yml and dispatch again.'
            exit 1
          fi
      # Deploys the checked-out held commit to `prod`.
      # Inlined from alchemy-run/alchemy action.yml at d0b4a3326718309793459160e94b35abee517b23 (v2.0.0-beta.85):
      # that commit carries a symlink (.vscode/tsrs-tsdk/tsgo) the runner cannot unpack, so `uses:` fails at
      # "Set up job". Go back to the action once upstream ships without the symlink.
      - name: Deploy prod
        run: alchemy deploy --stage prod --yes
        working-directory: infra
      - run: bun scripts/smoke.ts
        working-directory: infra
      - name: Commits in this deploy
        run: |
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo '### Commits in this deploy'
            echo
            if [ -n "$last" ]; then printf 'Since `%s`:\n\n' "$last"; else echo 'No release tag yet; all commits:'; echo; fi
            git log --format='- %s' "${last:+$last..}HEAD"
          } >> "$GITHUB_STEP_SUMMARY"
      # A release merged while prod was held is applied and tagged here, after the deploy.
      - id: app-token
        if: vars.RELEASE_ON == 'true'
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - if: vars.RELEASE_ON == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
